
services:


  # ──────────────────────────────────────────────────────────
  # NGINX — Single entry point (port 80)
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - h-hospital-portal
      - h-patient-portal
      - p-frontend
      - p-manager
      - p-employee
      - p-inventory
      - p-patient
      - p-billing
      - l-node-gateway
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # HOSPITAL BACKENDS
  # ──────────────────────────────────────────────────────────
  h-ipfs-service:
    image: ghcr.io/devbyhimans/ehr-h-ipfs-service:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/ipfs-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/ipfs-service:/app
      - h-ipfs-service-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
    ports:
      - "4006:4006"
    command: /bin/sh -c "rm -rf node_modules package-lock.json && npm install && npm start"
    restart: unless-stopped

  h-peer0-api:
    image: ghcr.io/devbyhimans/ehr-h-peer0-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer0-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer0-api:/app
      - h-peer0-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
    ports:
      - "4001:4001"
    command: /bin/sh -c "rm -rf node_modules package-lock.json && npm install && npm start"
    restart: unless-stopped

  h-peer1-api:
    image: ghcr.io/devbyhimans/ehr-h-peer1-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer1-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer1-api:/app
      - h-peer1-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
    ports:
      - "4002:4002"
    command: /bin/sh -c "rm -rf node_modules package-lock.json && npm install && npm start"
    restart: unless-stopped

  h-peer2-api:
    image: ghcr.io/devbyhimans/ehr-h-peer2-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer2-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer2-api:/app
      - h-peer2-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
    ports:
      - "4003:4003"
    command: /bin/sh -c "rm -rf node_modules package-lock.json && npm install && npm start"
    restart: unless-stopped

  h-extorg-api:
    image: ghcr.io/devbyhimans/ehr-h-extorg-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/extorg-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/extorg-api:/app
      - h-extorg-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
    ports:
      - "4004:4004"
    command: /bin/sh -c "rm -rf node_modules package-lock.json && npm install && npm start"
    restart: unless-stopped

  h-patient-api:
    image: ghcr.io/devbyhimans/ehr-h-patient-api:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/patient-api
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/patient-api:/app
      - h-patient-api-modules:/app/node_modules
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/shared:/shared
    ports:
      - "4005:4005"
    command: /bin/sh -c "rm -rf node_modules package-lock.json && npm install && npm start"
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # HOSPITAL FRONTENDS
  # ──────────────────────────────────────────────────────────
  h-hospital-portal:
    image: ghcr.io/devbyhimans/ehr-h-hospital-portal:latest
    build:
      context: ./orgs/hospital/EHR_hospitalOrg-main/ehr-frontend-v2/hospital-portal
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-frontend-v2/hospital-portal:/app
      - h-hospital-portal-modules:/app/node_modules
    ports:
      - "5173:5173"
    command: /bin/sh -c "rm -rf node_modules package-lock.json && npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

  h-patient-portal:
    image: ghcr.io/devbyhimans/ehr-h-patient-portal:latest
