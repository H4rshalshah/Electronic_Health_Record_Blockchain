events {
    worker_connections 1024;
}

http {
    # Map HTTP Upgrade header for WebSocket proxying (Vite HMR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        # ══════════════════════════════════════════════════
        # HOSPITAL ORG
        # ══════════════════════════════════════════════════

        # Redirect /patient → /patient/ (no trailing slash fix)
        location = /patient {
            return 301 /patient/;
        }
        # Hospital Patient Portal  →  http://localhost/patient/
        location /patient/ {
            proxy_pass         http://h-patient-portal:5174/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Hospital Backend APIs (for Postman / direct dev use)
        location /api/hospital/peer0/   { proxy_pass http://h-peer0-api:4001/;    }
        location /api/hospital/peer1/   { proxy_pass http://h-peer1-api:4002/;    }
        location /api/hospital/peer2/   { proxy_pass http://h-peer2-api:4003/;    }
        location /api/hospital/extorg/  { proxy_pass http://h-extorg-api:4004/;   }
        location /api/hospital/patient/ { proxy_pass http://h-patient-api:4005/;  }
        location /api/hospital/ipfs/    { proxy_pass http://h-ipfs-service:4006/; }

        # ══════════════════════════════════════════════════
        # PHARMACY ORG  (specific paths BEFORE /pharmacy/)
        # ══════════════════════════════════════════════════

        location = /pharmacy/manager   { return 301 /pharmacy/manager/;   }
        location /pharmacy/manager/ {
            proxy_pass         http://p-manager:3001/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        location = /pharmacy/employee   { return 301 /pharmacy/employee/;  }
        location /pharmacy/employee/ {
            proxy_pass         http://p-employee:3002/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        location = /pharmacy/inventory   { return 301 /pharmacy/inventory/; }
        location /pharmacy/inventory/ {
            proxy_pass         http://p-inventory:3003/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        location = /pharmacy/patient   { return 301 /pharmacy/patient/;   }
        location /pharmacy/patient/ {
            proxy_pass         http://p-patient:3004/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        location = /pharmacy/billing   { return 301 /pharmacy/billing/;   }
        location /pharmacy/billing/ {
            proxy_pass         http://p-billing:3005/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Pharmacy Backend API
        location /api/pharmacy/ {
            proxy_pass         http://p-backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # Pharmacy main frontend  →  http://localhost/pharmacy/
        location = /pharmacy   { return 301 /pharmacy/; }
        location /pharmacy/ {
            proxy_pass         http://p-frontend:5175/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ══════════════════════════════════════════════════
        # LAB ORG
        # ══════════════════════════════════════════════════

        location = /lab   { return 301 /lab/; }
        location /lab/ {
            proxy_pass         http://l-node-gateway:3000/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ══════════════════════════════════════════════════
        # HOSPITAL RECEPTION PORTAL — root (MUST be last)
        # http://localhost/  →  Hospital Reception
        # ══════════════════════════════════════════════════
        location / {
            proxy_pass         http://h-hospital-portal:5173/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
